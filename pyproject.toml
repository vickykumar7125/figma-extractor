[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "figma-extractor"
dynamic = ["version"]
description = "Extract design tokens, screens, components, and assets from local or remote Figma files"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vicky Kumar", email = "vickykumar7125@users.noreply.github.com" }]
keywords = ["figma", "design-tokens", "extractor", "cli", "design-system"]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Environment :: Console",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "typer>=0.15,<1",
  "rich>=13,<16",
  "orjson>=3.10",
  "zstandard>=0.23",
  "Pillow>=11",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
test = ["pytest>=8"]
llm = [
  "langgraph>=1.2,<2",
  "langchain>=1.4,<2",
  "langchain-core>=1.6,<2",
]
openai = [
  "langgraph>=1.2,<2",
  "langchain>=1.4,<2",
  "langchain-core>=1.6,<2",
  "langchain-openai>=1.6,<2",
  "openai>=1.99,<4",
]
anthropic = [
  "langgraph>=1.2,<2",
  "langchain>=1.4,<2",
  "langchain-core>=1.6,<2",
  "langchain-anthropic>=1.7,<2",
  "anthropic>=1.11,<2",
]
google = [
  "langgraph>=1.2,<2",
  "langchain>=1.4,<2",
  "langchain-core>=1.6,<2",
  "langchain-google-genai>=4.4,<5",
]
vertex = [
  "langgraph>=1.2,<2",
  "langchain>=1.4,<2",
  "langchain-core>=1.6,<2",
  "langchain-google-vertexai>=3.2,<4",
  "anthropic[vertex]>=1.11,<2",
]
ollama = [
  "langgraph>=1.2,<2",
  "langchain>=1.4,<2",
  "langchain-core>=1.6,<2",
  "langchain-ollama>=1.1,<2",
  "ollama>=0.6,<1",
]
huggingface = [
  "langgraph>=1.2,<2",
  "langchain>=1.4,<2",
  "langchain-core>=1.6,<2",
  "langchain-huggingface>=1.2,<2",
]
huggingface-local = [
  "figma-extractor[huggingface]",
  "transformers>=4.46,<6",
  "accelerate>=1.2,<2",
]
huggingface-quant = [
  "figma-extractor[huggingface-local]",
  "bitsandbytes>=0.45,<1",
]
groq = [
  "langgraph>=1.2,<2",
  "langchain>=1.4,<2",
  "langchain-core>=1.6,<2",
  "langchain-groq>=1.1,<2",
]
xai = [
  "langgraph>=1.2,<2",
  "langchain>=1.4,<2",
  "langchain-core>=1.6,<2",
  "langchain-xai>=1.3,<2",
]
nvidia = [
  "langgraph>=1.2,<2",
  "langchain>=1.4,<2",
  "langchain-core>=1.6,<2",
  "langchain-nvidia-ai-endpoints>=1.4,<2",
]
cohere = [
  "langgraph>=1.2,<2",
  "langchain>=1.4,<2",
  "langchain-core>=1.6,<2",
  "langchain-cohere>=0.6",
]
together = [
  "langgraph>=1.2,<2",
  "langchain>=1.4,<2",
  "langchain-core>=1.6,<2",
  "langchain-together>=0.4",
]
deepseek = [
  "langgraph>=1.2,<2",
  "langchain>=1.4,<2",
  "langchain-core>=1.6,<2",
  "langchain-deepseek>=1.1,<2",
]
all-llm = [
  "figma-extractor[openai]",
  "figma-extractor[anthropic]",
  "figma-extractor[google]",
  "figma-extractor[vertex]",
  "figma-extractor[ollama]",
  "figma-extractor[huggingface]",
  "figma-extractor[groq]",
  "figma-extractor[xai]",
  "figma-extractor[nvidia]",
  "figma-extractor[cohere]",
  "figma-extractor[together]",
  "figma-extractor[deepseek]",
]

[project.scripts]
figma-extractor = "figma_extractor.cli:app"

[project.urls]
Homepage = "https://github.com/vickykumar7125/figma-extractor"
Documentation = "https://vickykumar7125.github.io/figma-extractor/"
Repository = "https://github.com/vickykumar7125/figma-extractor"
Issues = "https://github.com/vickykumar7125/figma-extractor/issues"
Changelog = "https://github.com/vickykumar7125/figma-extractor/releases"

[tool.setuptools.dynamic]
version = { attr = "figma_extractor.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
figma_extractor = ["py.typed"]

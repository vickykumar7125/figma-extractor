[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "figma-extractor"
version = "1.1.0"
description = "Extract design tokens, screens, components, and assets from local or remote Figma files"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vicky Kumar", email = "vickykumar7125@users.noreply.github.com" }]
keywords = ["figma", "design-tokens", "extractor", "cli", "design-system"]
dependencies = [
  "typer>=0.15,<1",
  "rich>=13,<16",
  "orjson>=3.10",
  "zstandard>=0.23",
  "Pillow>=11",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
figma-extractor = "figma_extractor.cli:app"

[project.urls]
Homepage = "https://github.com/vickykumar7125/figma-extractor"
Repository = "https://github.com/vickykumar7125/figma-extractor"
Issues = "https://github.com/vickykumar7125/figma-extractor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
figma_extractor = ["py.typed"]
